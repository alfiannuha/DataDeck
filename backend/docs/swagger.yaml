components:
  schemas:
    api.HealthResponse:
      properties:
        status:
          example: healthy
          type: string
      type: object
    data:
      properties:
        data:
          $ref: '#/components/schemas/api.HealthResponse'
      type: object
    handler.ConnectionRequest:
      properties:
        database_name:
          example: app
          type: string
        driver:
          enum:
          - postgres
          - mysql
          - sqlite
          example: postgres
          type: string
        host:
          example: 127.0.0.1
          type: string
        name:
          example: Local PG
          type: string
        password:
          example: secret
          type: string
        port:
          example: 5432
          type: integer
        ssl_mode:
          enum:
          - disable
          - allow
          - prefer
          - require
          - verify-ca
          - verify-full
          example: disable
          type: string
        username:
          example: appuser
          type: string
      required:
      - driver
      - name
      type: object
    handler.ConnectionResponse:
      properties:
        created_at:
          type: string
        database_name:
          example: app
          type: string
        driver:
          enum:
          - postgres
          - mysql
          - sqlite
          example: postgres
          type: string
        host:
          example: 127.0.0.1
          type: string
        id:
          example: 9f1c7d2e4a6b4e89b88ad5f356bf7312
          type: string
        name:
          example: Local PG
          type: string
        port:
          example: 5432
          type: integer
        ssl_mode:
          example: disable
          type: string
        updated_at:
          type: string
        username:
          example: appuser
          type: string
      type: object
    handler.ConnectionTestRequest:
      properties:
        database_name:
          example: app
          type: string
        driver:
          enum:
          - postgres
          - mysql
          - sqlite
          example: postgres
          type: string
        host:
          example: 127.0.0.1
          type: string
        password:
          example: secret
          type: string
        port:
          example: 5432
          type: integer
        ssl_mode:
          enum:
          - disable
          - allow
          - prefer
          - require
          - verify-ca
          - verify-full
          example: disable
          type: string
        username:
          example: appuser
          type: string
      required:
      - driver
      type: object
    handler.DeleteConnectionResponse:
      properties:
        id:
          type: string
      type: object
    handler.HistoryRecord:
      properties:
        connection_id:
          type: string
        database_name:
          type: string
        error_message:
          type: string
        executed_at:
          type: string
        execution_time_ms:
          type: integer
        id:
          type: string
        rows_affected:
          type: integer
        sql_text:
          type: string
        status:
          enum:
          - SUCCESS
          - ERROR
          type: string
      type: object
    handler.QueryRequest:
      properties:
        connection_id:
          example: 9f1c7d2e4a6b4e89b88ad5f356bf7312
          type: string
        database:
          example: app
          type: string
        sql:
          example: SELECT 1
          type: string
        timeout_seconds:
          example: 30
          type: integer
      required:
      - connection_id
      - sql
      type: object
    handler.SavedQueryRequest:
      properties:
        connection_id:
          example: 9f1c7d2e4a6b4e89b88ad5f356bf7312
          type: string
        database_name:
          example: app
          type: string
        sql_text:
          example: SELECT * FROM users WHERE status = 'active'
          type: string
        tags:
          example: users,report
          type: string
        title:
          example: Active users
          type: string
      required:
      - sql_text
      - title
      type: object
    handler.SavedQueryResponse:
      properties:
        connection_id:
          type: string
        created_at:
          type: string
        database_name:
          type: string
        id:
          type: string
        sql_text:
          type: string
        tags:
          type: string
        title:
          type: string
        updated_at:
          type: string
      type: object
    handler.TestConnectionResponse:
      properties:
        status:
          example: ok
          type: string
      type: object
    model.Column:
      properties:
        data_type:
          type: string
        default:
          type: string
        name:
          type: string
        nullable:
          type: boolean
        ordinal_position:
          type: integer
      type: object
    model.Database:
      properties:
        name:
          type: string
        schemas:
          items:
            $ref: '#/components/schemas/model.Schema'
          type: array
          uniqueItems: false
        tables:
          items:
            $ref: '#/components/schemas/model.Table'
          type: array
          uniqueItems: false
      type: object
    model.DatabaseInfo:
      properties:
        bootstrap_candidate:
          description: |-
            BootstrapCandidate marks the conventional maintenance database (e.g.
            PostgreSQL "postgres") used when a profile has no default database.
          type: boolean
        name:
          type: string
      type: object
    model.ForeignKey:
      properties:
        columns:
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          type: string
        referenced_columns:
          items:
            type: string
          type: array
          uniqueItems: false
        referenced_schema:
          type: string
        referenced_table:
          type: string
      type: object
    model.Index:
      properties:
        columns:
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          type: string
        primary:
          type: boolean
        unique:
          type: boolean
      type: object
    model.PrimaryKey:
      properties:
        columns:
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          type: string
      type: object
    model.QueryColumn:
      properties:
        name:
          type: string
        type:
          type: string
      type: object
    model.QueryResult:
      properties:
        columns:
          items:
            $ref: '#/components/schemas/model.QueryColumn'
          type: array
          uniqueItems: false
        execution_time_ms:
          type: integer
        rows:
          items:
            items: {}
            type: array
          type: array
          uniqueItems: false
        rows_affected:
          type: integer
        truncated:
          type: boolean
      type: object
    model.Schema:
      properties:
        name:
          type: string
        tables:
          items:
            $ref: '#/components/schemas/model.Table'
          type: array
          uniqueItems: false
      type: object
    model.Table:
      properties:
        columns:
          items:
            $ref: '#/components/schemas/model.Column'
          type: array
          uniqueItems: false
        foreign_keys:
          items:
            $ref: '#/components/schemas/model.ForeignKey'
          type: array
          uniqueItems: false
        indexes:
          items:
            $ref: '#/components/schemas/model.Index'
          type: array
          uniqueItems: false
        name:
          type: string
        primary_key:
          $ref: '#/components/schemas/model.PrimaryKey'
        schema:
          type: string
        type:
          type: string
      type: object
    model.TableColumnInfo:
      properties:
        database_type:
          type: string
        name:
          type: string
        nullable:
          type: boolean
        ordinal_position:
          type: integer
        primary_key:
          type: boolean
      type: object
    model.TableDataPage:
      properties:
        columns:
          items:
            $ref: '#/components/schemas/model.TableColumnInfo'
          type: array
          uniqueItems: false
        database:
          type: string
        object_type:
          type: string
        pagination:
          $ref: '#/components/schemas/model.TablePagination'
        rows:
          items:
            items: {}
            type: array
          type: array
          uniqueItems: false
        schema:
          type: string
        table:
          type: string
        truncated:
          description: Truncated is true when the shared 50 MB result cap stopped
            the page short.
          type: boolean
      type: object
    model.TablePagination:
      properties:
        has_more:
          type: boolean
        page:
          type: integer
        page_size:
          type: integer
      type: object
    response.APIError:
      properties:
        code:
          type: string
        message:
          type: string
        position:
          type: integer
      type: object
    response.Envelope:
      allOf:
      - $ref: '#/components/schemas/data'
      properties:
        data: {}
        error:
          $ref: '#/components/schemas/response.APIError'
        meta:
          additionalProperties: {}
          type: object
        success:
          type: boolean
      type: object
    response.ErrorEnvelope:
      properties:
        data:
          description: always null
        error:
          $ref: '#/components/schemas/response.APIError'
        meta:
          additionalProperties: {}
          type: object
        success:
          example: false
          type: boolean
      type: object
externalDocs:
  description: ""
  url: ""
info:
  description: Local-first database GUI backend. All responses use the standard envelope
    (success, data, error, meta).
  title: DataDeck API
  version: "1.0"
openapi: 3.1.0
paths:
  /connections:
    get:
      description: Returns all persisted connection profiles with credentials omitted.
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Internal Server Error
      summary: List connection profiles
      tags:
      - connections
    post:
      description: Validates and persists a profile. The password is encrypted at
        rest and never returned.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handler.ConnectionRequest'
              description: Connection profile
              summary: request
        description: Connection profile
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Internal Server Error
      summary: Create a connection profile
      tags:
      - connections
  /connections/{id}:
    delete:
      description: Closes any active pool and removes the profile.
      parameters:
      - description: Connection id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Internal Server Error
      summary: Delete a connection profile
      tags:
      - connections
  /connections/{id}/databases:
    get:
      description: Discovers the databases available on a server-level connection
        (PostgreSQL). Not supported for MySQL/SQLite.
      parameters:
      - description: Connection id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Implemented
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Gateway
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Gateway Timeout
      summary: List selectable databases
      tags:
      - schema
  /connections/{id}/schemas:
    get:
      description: Returns a database-neutral schema tree (schemas, tables, columns,
        primary keys, foreign keys, indexes) for a stored connection.
      parameters:
      - description: Connection id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Gateway
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Gateway Timeout
      summary: Get database schema
      tags:
      - schema
  /connections/{id}/table-data:
    get:
      description: Returns one bounded, paginated page of rows from a specific table
        without requiring the caller to write SQL. The target is the explicit connection
        + database + schema + table; global/explorer selection is never used.
      parameters:
      - description: Connection id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Target database (required for server-level PostgreSQL)
        in: query
        name: database
        schema:
          type: string
      - description: Schema (required for PostgreSQL)
        in: query
        name: schema
        schema:
          type: string
      - description: Table or view name
        in: query
        name: table
        required: true
        schema:
          type: string
      - description: 1-based page number (default 1)
        in: query
        name: page
        schema:
          type: integer
      - description: Rows per page (default 100, max 200)
        in: query
        name: page_size
        schema:
          type: integer
      - description: Column to sort by (validated against metadata)
        in: query
        name: sort_column
        schema:
          type: string
      - description: Sort direction
        in: query
        name: sort_direction
        schema:
          enum:
          - asc
          - desc
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Gateway
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Gateway Timeout
      summary: Browse table data
      tags:
      - table-data
  /connections/test:
    post:
      description: Validates parameters and attempts a temporary connection. Nothing
        is persisted.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handler.ConnectionTestRequest'
              description: Connection parameters
              summary: request
        description: Connection parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Request
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Gateway
      summary: Test connection parameters
      tags:
      - connections
  /health:
    get:
      description: Reports whether the daemon is running.
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
      summary: Health check
      tags:
      - system
  /queries/saved:
    get:
      description: Returns saved queries newest-updated first, optionally filtered
        by connection. (M3 API extension.)
      parameters:
      - description: Filter by connection id
        in: query
        name: connection_id
        schema:
          type: string
      - description: Page number (1-based)
        in: query
        name: page
        schema:
          type: integer
      - description: Page size (max 200)
        in: query
        name: page_size
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Internal Server Error
      summary: List saved queries
      tags:
      - saved-queries
    post:
      description: Persists a SQL snippet. The SQL is stored, never executed. (PRD
        endpoint.)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handler.SavedQueryRequest'
              description: Saved query
              summary: request
        description: Saved query
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
      summary: Create a saved query
      tags:
      - saved-queries
  /queries/saved/{id}:
    delete:
      parameters:
      - description: Saved query id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
      summary: Delete a saved query
      tags:
      - saved-queries
    get:
      parameters:
      - description: Saved query id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
      summary: Get a saved query
      tags:
      - saved-queries
    put:
      description: Replaces the mutable fields of a saved query. (M3 API extension.)
      parameters:
      - description: Saved query id
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handler.SavedQueryRequest'
              description: Saved query
              summary: request
        description: Saved query
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
      summary: Update a saved query
      tags:
      - saved-queries
  /query/execute:
    post:
      description: Runs a single SQL statement against a stored connection under a
        bounded timeout and records the attempt in history.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handler.QueryRequest'
              description: Query
              summary: request
        description: Query
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data: {}
                  error:
                    $ref: '#/components/schemas/response.APIError'
                  meta:
                    additionalProperties: {}
                    type: object
                  success:
                    type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Not Found
        "499":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Bad Gateway
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorEnvelope'
          description: Gateway Timeout
      summary: Execute a SQL statement
      tags:
      - query
  /query/history:
    get:
      description: Returns recent executions newest-first, optionally filtered by
        connection.
      parameters:
      - description: Filter by connection id
        in: query
        name: connection_id
